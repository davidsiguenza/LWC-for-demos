<template>
    <lightning-card title="Tier Progress" icon-name="standard:trailhead">
        <template lwc:if={loading}>
            <div class="slds-p-around_medium">
                <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
            </div>
        </template>

        <template lwc:elseif={hasError}>
            <div class="slds-p-around_medium slds-text-color_error">{errorMessage}</div>
        </template>

        <template lwc:elseif={hasStepper}>
            <div class="slds-p-around_medium">
                <!-- Current tier heading -->
                <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-end slds-m-bottom_small">
                    <div>
                        <p class="slds-text-title_caps slds-text-color_weak">Current tier</p>
                        <p class="slds-text-heading_medium" style={currentTierStyle}>
                            {currentTierName}
                        </p>
                    </div>
                    <template lwc:if={showNextTier}>
                        <div class="slds-text-align_right">
                            <p class="slds-text-title_caps slds-text-color_weak">Next</p>
                            <p class="slds-text-body_regular">{nextTierName}</p>
                        </div>
                    </template>
                </div>

                <!-- Stepper -->
                <div class="tier-stepper">
                    <template for:each={stepperWithMeta} for:item="step" for:index="idx">
                        <div key={step.tierId} class={step.containerClass}>
                            <div class={step.markerClass} style={step.markerStyle}>
                                <template lwc:if={step.isCompleted}>
                                    <lightning-icon icon-name="utility:check" size="x-small" variant="inverse"></lightning-icon>
                                </template>
                                <template lwc:elseif={step.isCurrent}>
                                    <lightning-icon icon-name="utility:trending" size="x-small" variant="inverse"></lightning-icon>
                                </template>
                                <template lwc:else>
                                    <lightning-icon icon-name="utility:lock" size="x-small" variant="inverse"></lightning-icon>
                                </template>
                            </div>
                            <p class="slds-text-body_small slds-m-top_xx-small">{step.name}</p>
                            <p class="slds-text-body_small slds-text-color_weak">{step.thresholdLabel}</p>
                        </div>
                        <template lwc:if={step.hasConnector}>
                            <div key={step.connectorKey} class="tier-connector">
                                <div class="tier-connector-fill" style={step.connectorFillStyle}></div>
                            </div>
                        </template>
                    </template>
                </div>

                <!-- Footer message -->
                <template lwc:if={showProgressCopy}>
                    <p class="slds-text-body_small slds-m-top_medium slds-text-align_center">
                        <strong>{pointsToNextTier}</strong> {currencyLabel} to reach {nextTierName}
                        <span class="slds-text-color_weak"> · {progressPct}% complete</span>
                    </p>
                </template>

                <template lwc:elseif={atTopTier}>
                    <p class="slds-text-body_small slds-text-color_success slds-m-top_medium slds-text-align_center">
                        You've reached the top tier. Keep earning to maintain your benefits.
                    </p>
                </template>
            </div>
        </template>

        <template lwc:else>
            <div class="slds-p-around_medium slds-text-color_weak">
                No tier assigned yet.
            </div>
        </template>
    </lightning-card>
</template>
