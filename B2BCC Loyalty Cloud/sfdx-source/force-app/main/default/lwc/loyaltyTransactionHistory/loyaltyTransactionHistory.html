<template>
    <lightning-card title="Transaction History" icon-name="standard:timeslot">
        <template lwc:if={loading}>
            <div class="slds-p-around_medium">
                <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
            </div>
        </template>

        <template lwc:elseif={hasError}>
            <div class="slds-p-around_medium slds-text-color_error">{errorMessage}</div>
        </template>

        <template lwc:elseif={hasTransactions}>
            <lightning-datatable
                key-field="id"
                data={transactions}
                columns={columns}
                hide-checkbox-column
                resize-column-disabled>
            </lightning-datatable>
            <div class="slds-grid slds-grid_align-end slds-p-around_small">
                <lightning-button
                    label="Previous"
                    disabled={prevDisabled}
                    onclick={handlePrev}
                    class="slds-m-right_x-small">
                </lightning-button>
                <lightning-button
                    label="Next"
                    disabled={nextDisabled}
                    onclick={handleNext}>
                </lightning-button>
            </div>
        </template>

        <template lwc:else>
            <div class="slds-p-around_medium slds-text-color_weak">
                No transactions yet.
            </div>
        </template>
    </lightning-card>
</template>
