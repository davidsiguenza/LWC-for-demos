<template>
    <lightning-card title="Redeem Loyalty Points" icon-name="standard:loyalty_program">
        <template lwc:if={loading}>
            <div class="slds-p-around_medium">
                <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
            </div>
        </template>

        <template lwc:elseif={hasQuote}>
            <div class="slds-p-around_medium">
                <div class="slds-grid slds-grid_align-spread slds-m-bottom_small">
                    <div>
                        <p class="slds-text-title_caps slds-text-color_weak">Available</p>
                        <p class="slds-text-heading_medium">{formattedAvailable} {currencyLabel}</p>
                    </div>
                    <div class="slds-text-align_right">
                        <p class="slds-text-title_caps slds-text-color_weak">Ratio</p>
                        <p class="slds-text-body_regular">{ratioLabel}</p>
                    </div>
                </div>

                <template lwc:if={hasActiveRedemption}>
                    <div class="slds-notify slds-notify_alert slds-alert_success slds-m-bottom_small" role="alert">
                        <h2 class="slds-text-body_regular">{activeRedemptionMessage}</h2>
                    </div>
                    <lightning-button
                        label="Remove loyalty discount"
                        variant="neutral"
                        onclick={handleRemove}
                        disabled={submitting}>
                    </lightning-button>
                </template>

                <template lwc:else>
                    <lightning-input
                        type="number"
                        label="Points to redeem"
                        value={pointsInput}
                        min="0"
                        step="1"
                        onchange={handleInputChange}
                        class="slds-m-bottom_small">
                    </lightning-input>
                    <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_small">
                        {estimatedLabel}
                    </p>
                    <lightning-button
                        label="Apply points"
                        variant="brand"
                        onclick={handleApply}
                        disabled={applyDisabled}>
                    </lightning-button>
                </template>

                <template lwc:if={statusMessage}>
                    <p class={statusClass}>{statusMessage}</p>
                </template>
            </div>
        </template>

        <template lwc:else>
            <div class="slds-p-around_medium slds-text-color_weak">
                {fallbackMessage}
            </div>
        </template>
    </lightning-card>
</template>
