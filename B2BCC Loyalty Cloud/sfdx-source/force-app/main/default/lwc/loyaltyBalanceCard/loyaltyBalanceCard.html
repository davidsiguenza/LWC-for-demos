<template>
    <lightning-card title="My Loyalty Balance" icon-name="standard:loyalty_program">
        <template lwc:if={loading}>
            <div class="slds-p-around_medium">
                <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
            </div>
        </template>

        <template lwc:elseif={hasError}>
            <div class="slds-p-around_medium slds-text-color_error">
                {errorMessage}
            </div>
        </template>

        <template lwc:elseif={hasMember}>
            <div class="slds-p-around_medium slds-grid slds-wrap slds-gutters">
                <div class="slds-col slds-size_1-of-2">
                    <p class="slds-text-title_caps slds-text-color_weak">Available to redeem</p>
                    <p class="slds-text-heading_large slds-text-color_success">{formattedAvailable}</p>
                    <p class="slds-text-body_small slds-text-color_weak">{currencyLabel}</p>
                </div>
                <div class="slds-col slds-size_1-of-2">
                    <p class="slds-text-title_caps slds-text-color_weak">Total balance</p>
                    <p class="slds-text-heading_medium">{formattedBalance}</p>
                    <template lwc:if={hasEscrow}>
                        <p class="slds-text-body_small slds-text-color_weak">
                            Pending: {formattedEscrow}
                        </p>
                    </template>
                </div>

                <div class="slds-col slds-size_1-of-1 slds-m-top_medium slds-border_top slds-p-top_small">
                    <p class="slds-text-title_caps slds-text-color_weak">Current tier</p>
                    <p class="slds-text-heading_small">{tierDisplay}</p>
                    <p class="slds-text-body_small slds-text-color_weak">
                        Membership {membershipNumber} · {memberStatus}
                    </p>
                </div>
            </div>
        </template>

        <template lwc:else>
            <div class="slds-p-around_medium slds-text-color_weak">
                You are not enrolled in a loyalty program for this store yet.
            </div>
        </template>
    </lightning-card>
</template>
